<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 128 128"
    fill="none"
>
    <title>PopShot Icon</title>
    <defs>
        <linearGradient
            id="bg"
            x1="18"
            y1="8"
            x2="110"
            y2="122"
            gradientUnits="userSpaceOnUse"
        >
            <stop stop-color="#344B70"/>
            <stop offset="0.48" stop-color="#1E304E"/>
            <stop offset="1" stop-color="#111A2B"/>
        </linearGradient>

        <linearGradient
            id="screen"
            x1="34"
            y1="36"
            x2="92"
            y2="88"
            gradientUnits="userSpaceOnUse"
        >
            <stop stop-color="#80B9FF"/>
            <stop offset="1" stop-color="#3868AC"/>
        </linearGradient>

        <linearGradient
            id="mountain"
            x1="34"
            y1="58"
            x2="94"
            y2="91"
            gradientUnits="userSpaceOnUse"
        >
            <stop stop-color="#79B7FF"/>
            <stop offset="1" stop-color="#3971C3"/>
        </linearGradient>

        <linearGradient
            id="handle"
            x1="86"
            y1="92"
            x2="116"
            y2="116"
            gradientUnits="userSpaceOnUse"
        >
            <stop stop-color="#79BBFF"/>
            <stop offset="1" stop-color="#3D7DE0"/>
        </linearGradient>

        <filter
            id="shadow"
            x="-35%"
            y="-35%"
            width="170%"
            height="170%"
        >
            <feDropShadow
                dx="0"
                dy="3"
                stdDeviation="3"
                flood-color="#000000"
                flood-opacity="0.30"
            />
        </filter>

        <clipPath id="previewClip">
            <rect
                x="29"
                y="34"
                width="70"
                height="62"
                rx="7"
            />
        </clipPath>
    </defs>

    <!-- App tile -->
    <rect
        x="6"
        y="6"
        width="116"
        height="116"
        rx="27"
        fill="url(#bg)"
    />

    <rect
        x="7.5"
        y="7.5"
        width="113"
        height="113"
        rx="25.5"
        stroke="#8EACE0"
        stroke-opacity="0.24"
        stroke-width="3"
    />

    <!-- Screenshot preview -->
    <g clip-path="url(#previewClip)">
        <rect
            x="29"
            y="34"
            width="70"
            height="62"
            rx="7"
            fill="url(#screen)"
            opacity="0.9"
        />

        <!-- sky highlight -->
        <path
            d="M29 34H99L48 96H29V34Z"
            fill="#FFFFFF"
            opacity="0.08"
        />

        <!-- sun -->
        <circle
            cx="78"
            cy="51"
            r="8"
            fill="#DCEBFF"
            opacity="0.95"
        />

        <!-- rear mountain -->
        <path
            d="
                M54 82
                L72 65
                C74.4 62.8 77.8 62.8 80.2 65
                L100 82
                V98
                H54
                V82
                Z
            "
            fill="#4678C2"
        />

        <!-- foreground mountain -->
        <path
            d="
                M27 86
                L51 60
                C53.8 57 58.2 57 61 60
                L91 88
                V99
                H27
                V86
                Z
            "
            fill="url(#mountain)"
        />

        <path
            d="
                M27 88
                C43 78 57 79 72 86
                C82 91 90 91 100 87
                V99
                H27
                V88
                Z
            "
            fill="#284D82"
            opacity="0.65"
        />
    </g>

    <!--
        Selection frame.
    -->
    <rect
        x="26.5"
        y="31.5"
        width="75"
        height="67"
        rx="9.5"
        stroke="#F4F8FF"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-dasharray="12 9"
        stroke-dashoffset="4.5"
        filter="url(#shadow)"
    />
</svg>
